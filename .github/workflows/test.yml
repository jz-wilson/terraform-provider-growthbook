# Terraform Provider testing workflow.
name: Tests

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - run: go mod download
      - run: go build -v .
      - run: go vet ./...
      - name: Unit tests
        run: go test -v -cover ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  # Acceptance tests run against a real GrowthBook started from
  # e2e/docker-compose.yml, across a matrix of Terraform CLI versions.
  test:
    name: 'Acceptance Tests: Terraform ${{ matrix.terraform }}'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        terraform:
          - '1.13.*'
          - '1.16.*'
    env:
      GROWTHBOOK_API_URL: http://localhost:3100/api
      GROWTHBOOK_LIVE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false
      - name: Start GrowthBook
        run: docker compose -f e2e/docker-compose.yml up -d --wait
      - name: Mint API key
        run: |
          KEY=$(e2e/bootstrap.sh)
          echo "::add-mask::${KEY}"
          echo "GROWTHBOOK_API_KEY=${KEY}" >> "$GITHUB_ENV"
      - run: go mod download
      - env:
          TF_ACC: "1"
        run: go test -v -cover -timeout 20m ./internal/provider/
      - name: Sweep leaked tf-acc-* objects
        # Runs even when the acceptance tests above failed or were
        # cancelled: a mid-test failure can leave a growthbook_feature or
        # growthbook_sdk_connection created but never destroyed. The
        # sweepers in internal/provider/sweeper_test.go delete only objects
        # whose key/name starts with tf-acc-, so this never touches
        # anything else in the compose GrowthBook instance.
        if: always()
        run: go test ./internal/provider -v -sweep=all -timeout 10m
      - name: GrowthBook logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --no-color growthbook | tail -200
